version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # mcp 2.x changed the FastMCP API; upgrade deliberately, not automatically
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # stay on a stable Python; move to a new minor version by hand once it is released and tested
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
